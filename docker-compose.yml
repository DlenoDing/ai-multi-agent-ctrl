services:
  control-plane:
    build: .
    # 宿主重启／进程崩掉之后要自己回来 —— agent 节点都指着这个地址，它不在，
    # 排队的派发就一直停着，而没有任何人会收到通知。unless-stopped：人显式 stop 过的不自动拉起。
    # 配置错导致起不来时不会被掩盖：启动报文里写着具体原因（缺哪个变量、哪份 JSON 坏了），
    # 而 healthcheck 不会转 healthy，`docker compose up --wait` 照样等不到。
    restart: unless-stopped
    ports:
      - "${AIMAC_PORT:-4317}:4317"
    environment:
      AIMAC_HOST: "0.0.0.0"
      AIMAC_PORT: "4317"
      AIMAC_PUBLIC_URL: "${AIMAC_PUBLIC_URL:?AIMAC_PUBLIC_URL is required}"
      AIMAC_TRUST_PROXY: "${AIMAC_TRUST_PROXY:-false}"
      AIMAC_RUNTIME_DIR: "/app/.runtime"
      AIMAC_REPOSITORY_ROOT: "/app"
      AIMAC_STATE_STORE: "postgresql"
      # 自治循环间隔：容器里此前完全不可配 —— 既调不了频率，出事时也关不掉。
      # 设为 0 即关闭（关闭后后台不推进任何东西，控制台会明说）。
      AIMAC_ORCHESTRATOR_INTERVAL_MS: "${AIMAC_ORCHESTRATOR_INTERVAL_MS:-60000}"
      AIMAC_SYSTEM_ADMIN_EMAIL: "${AIMAC_SYSTEM_ADMIN_EMAIL:-system.admin@local}"
      AIMAC_SYSTEM_ADMIN_NAME: "${AIMAC_SYSTEM_ADMIN_NAME:-System Owner}"
      AIMAC_BOOTSTRAP_TOKEN: "${AIMAC_BOOTSTRAP_TOKEN:?AIMAC_BOOTSTRAP_TOKEN is required}"
      AIMAC_MCP_SERVICE_TOKEN: "${AIMAC_MCP_SERVICE_TOKEN:?AIMAC_MCP_SERVICE_TOKEN is required}"
      AIMAC_LOCAL_SEED_ORG_ADMIN_TOKEN: "${AIMAC_LOCAL_SEED_ORG_ADMIN_TOKEN:?AIMAC_LOCAL_SEED_ORG_ADMIN_TOKEN is required for the default organization admin}"
      AIMAC_LOCAL_SEED_WORKSPACE_OWNER_TOKEN: "${AIMAC_LOCAL_SEED_WORKSPACE_OWNER_TOKEN:?AIMAC_LOCAL_SEED_WORKSPACE_OWNER_TOKEN is required for local seed accounts}"
      AIMAC_LOCAL_SEED_REVIEWER_TOKEN: "${AIMAC_LOCAL_SEED_REVIEWER_TOKEN:?AIMAC_LOCAL_SEED_REVIEWER_TOKEN is required for local seed accounts}"
      AIMAC_LOCAL_SEED_AGENT_RUNTIME_TOKEN: "${AIMAC_LOCAL_SEED_AGENT_RUNTIME_TOKEN:?AIMAC_LOCAL_SEED_AGENT_RUNTIME_TOKEN is required for local seed accounts}"
      DATABASE_URL: "postgres://aimac:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/aimac"
    volumes:
      - aimac-runtime:/app/.runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4317/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "aimac"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "aimac"
    ports:
      # 只绑回环。控制面走内网 postgres:5432 连它，发布出来只是为了在宿主上 psql／跑自检。
      # 写成 "55432:5432" 的话监听的是 0.0.0.0 —— 而 Docker 的端口发布会【绕过宿主防火墙】
      #（UFW 那类规则挡不住它），云上 `docker compose up` 一开，整份控制面状态所在的库
      # 就只隔着一个 POSTGRES_PASSWORD 暴露在公网上。
      - "127.0.0.1:55432:5432"
    volumes:
      - aimac-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimac -d aimac"]
      interval: 10s
      timeout: 3s
      retries: 12
      # The official image runs a temporary init server on the unix socket before TCP is up; a
      # start_period keeps early probes from marking the container healthy (and unblocking the gated
      # control-plane) before the real listener accepts connections.
      start_period: 10s

volumes:
  aimac-runtime:
  aimac-postgres:
